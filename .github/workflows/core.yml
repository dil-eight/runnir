name: Go Core

# Runs only when something the Go Core is built from changes.
on:
  push:
    branches: [main]
    paths: &core-inputs
      - "core/**"
      - "contracts/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "scripts/generate-contracts.sh"
      - "apps/macos/Runnir/IPC/Generated/**"
      - "third_party/act/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths: *core-inputs
  # Weekly, so newly published vulnerabilities in Go or dependencies are
  # reported even when nobody changes Core code.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the running checks obsolete;
# runs on main always finish.
concurrency:
  group: go-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    # The weekly run only rescans for vulnerabilities.
    if: github.event_name != 'schedule'
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - run: go version
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run ./cmd/runnir version

  cross-build:
    # The weekly run only rescans for vulnerabilities. The binaries only show
    # that every target builds and are not uploaded; release.yml publishes
    # the tagged ones as release assets.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Cross-compile
        working-directory: core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          go build -trimpath -o "../build/runnir-${GOOS}-${GOARCH}${suffix}" ./cmd/runnir

  contracts:
    # The weekly run only rescans for vulnerabilities.
    if: github.event_name != 'schedule'
    name: Contract and generated code
    # The Swift generators are built from source, which needs Swift.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Install generators
        # The versions that produced the committed code; see scripts/generate-contracts.sh.
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.65.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          for spec in apple/swift-protobuf@1.39.0@protoc-gen-swift grpc/grpc-swift-protobuf@2.5.0@protoc-gen-grpc-swift-2; do
            repo=${spec%%@*}; rest=${spec#*@}; tag=${rest%%@*}; product=${rest#*@}
            dir="$RUNNER_TEMP/${repo#*/}"
            git clone --quiet --depth 1 --branch "$tag" "https://github.com/$repo.git" "$dir"
            swift build -c release --product "$product" --package-path "$dir"
            swift build -c release --show-bin-path --package-path "$dir" >> "$GITHUB_PATH"
          done
      - name: Lint and generate
        run: sh scripts/generate-contracts.sh
      - name: Generated code matches the contract
        run: git diff --exit-code -- core/internal/gen apps/macos/Runnir/IPC/Generated
      - name: No breaking changes
        if: github.event_name == 'pull_request'
        run: buf breaking --against ".git#branch=origin/${{ github.base_ref }}"

  lint-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Formatting
        working-directory: core
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vulnerability scan
        working-directory: core
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      # The app ships act built from third_party/act (ADR 0006). Known
      # findings act cannot take a fix for yet are listed with their reason.
      - name: Vulnerability scan of the bundled act
        working-directory: third_party/act
        run: |
          # GO-2026-6253 (moby/go-archive): the fixed versions drop an API
          # act 0.2.89 uses; act calls the package to build local Docker
          # actions. Remove once act supports go-archive 0.3.0 or newer.
          known='GO-2026-6253'
          found=$(govulncheck -format json github.com/nektos/act \
            | jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' \
            | sort -u | grep -vxF "$known" || true)
          if [ -n "$found" ]; then
            echo "Vulnerabilities reachable in the bundled act:"
            echo "$found"
            exit 1
          fi
