name: App Build

# Builds an unsigned universal Runnir.app on every pull request and push to
# main to check that it archives and is universal. Nothing is uploaded: the
# only kept builds are the assets of tagged releases (release.yml).
on:
  pull_request:
    paths: &app-inputs
      - "apps/**"
      - "core/**"
      - "contracts/**"
      - "docs/design/assets/**"
      - "scripts/build-core-macos.sh"
      - "third_party/act/**"
      - ".github/workflows/app-build.yml"
  push:
    branches: [main]
    paths: *app-inputs
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the running build obsolete;
# builds on main always finish.
concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Unsigned app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        # Swift package dependencies (gRPC, SwiftNIO) need Swift 6.2 or newer.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Archive
        run: |
          xcodebuild archive \
            -project apps/macos/Runnir.xcodeproj \
            -scheme Runnir \
            -destination 'generic/platform=macOS' \
            -archivePath "$PWD/build/Runnir.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Check architectures
        run: |
          app=build/Runnir.xcarchive/Products/Applications/Runnir.app
          for binary in "$app/Contents/MacOS/Runnir" "$app/Contents/Helpers/runnir-core"; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "not universal" >&2; exit 1 ;; esac
          done

      - name: Summary
        run: |
          {
            echo "### Runnir app build"
            echo
            echo "Unsigned universal build (arm64 + x86_64), macOS 15 or newer: archived and checked, not uploaded."
            echo "Downloadable builds are published only as assets of tagged releases."
          } >> "$GITHUB_STEP_SUMMARY"
