name: Release Build

# The only workflow that keeps build output: the tagged app and Core binaries
# are published as assets of a draft GitHub release. One job builds them all,
# so no Actions artifacts are needed to pass files between jobs. The app and
# the macOS Core binaries are signed with Developer ID and notarized (B48);
# the credentials live in the release environment, which only v* tags reach.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release
    runs-on: macos-26
    environment: release
    timeout-minutes: 120
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP: build/Runnir.xcarchive/Products/Applications/Runnir.app
    steps:
      - uses: actions/checkout@v7

      - name: Pick the build
        # v1.2.3 is a release, v1.2.3-alpha.N an alpha and v1.2.3-beta.N a
        # beta (B47); any other tag stops here instead of shipping unmarked.
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            build=release icon=AppIcon
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            build=alpha icon=AppIcon-Alpha
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            build=beta icon=AppIcon-Beta
          else
            echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z, vX.Y.Z-alpha.N or vX.Y.Z-beta.N"
            exit 1
          fi
          echo "RUNNIR_BUILD=$build" >> "$GITHUB_ENV"
          echo "RUNNIR_ICON=$icon" >> "$GITHUB_ENV"

      - name: Check signing credentials
        # A tag without them, or with a profile that does not list the
        # certificate of the .p12, fails here instead of after the build. The
        # .p12 is read in a keychain of its own that is deleted at once.
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          DEVELOPER_ID_PROFILE: ${{ secrets.DEVELOPER_ID_PROFILE }}
        run: |
          missing=""
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID DEVELOPER_ID_PROFILE APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in the release environment:$missing"
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/check.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/check.p12"
          security import "$RUNNER_TEMP/check.p12" -k "$keychain" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" > /dev/null
          rm -f "$RUNNER_TEMP/check.p12"
          certificate=$(security find-certificate -a -Z -c "Developer ID Application: " "$keychain" | awk '/^SHA-1 hash:/ { print $3 }' || true)
          security delete-keychain "$keychain"
          if [ "$(printf '%s' "$certificate" | grep -c . || true)" -ne 1 ]; then
            echo "::error::DEVELOPER_ID_P12 must hold exactly one Developer ID Application certificate"
            exit 1
          fi
          printf '%s' "$DEVELOPER_ID_PROFILE" | base64 --decode > "$RUNNER_TEMP/check.provisionprofile"
          scripts/check-profile.sh "$RUNNER_TEMP/check.provisionprofile" com.runnir.app "$certificate" > /dev/null
          rm -f "$RUNNER_TEMP/check.provisionprofile"

      - name: Select newest Xcode
        # Swift package dependencies (gRPC, SwiftNIO) need Swift 6.2 or newer.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Build Core binaries
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: |
          for goos in darwin linux windows; do
            for goarch in arm64 amd64; do
              suffix=""
              if [ "$goos" = windows ]; then suffix=".exe"; fi
              GOOS=$goos GOARCH=$goarch go build -trimpath \
                -ldflags "-X runnir/core/internal/buildinfo.Version=${GITHUB_REF_NAME#v}" \
                -o "../build/export/runnir-${GITHUB_REF_NAME}-${goos}-${goarch}${suffix}" ./cmd/runnir
            done
          done

      - name: Build archive
        run: |
          xcodebuild archive \
            -project apps/macos/Runnir.xcodeproj \
            -scheme Runnir \
            -destination 'generic/platform=macOS' \
            -archivePath "$PWD/build/Runnir.xcarchive" \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            RUNNIR_BUILD="$RUNNIR_BUILD" \
            CODE_SIGNING_ALLOWED=NO

      - name: Check the build
        run: scripts/check-app-build.sh "$APP" com.runnir.app "$RUNNIR_BUILD" "$RUNNIR_ICON"

      - name: Set up the signing keychain
        # Only now that everything is built: no build step runs while the
        # key can sign. A temporary keychain holds the Developer ID
        # certificate for codesign only, with Apple's Developer ID G2
        # intermediate (pinned by its SHA-256) to complete its chain; the
        # notarization key and the app's provisioning profile go to the job's
        # temporary folder.
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          DEVELOPER_ID_PROFILE: ${{ secrets.DEVELOPER_ID_PROFILE }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security list-keychains -d user | sed 's/^ *"//; s/"$//' > "$RUNNER_TEMP/keychains.txt"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $RUNNER_TEMP/DeveloperIDG2CA.cer" | shasum -a 256 -c - > /dev/null
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          set -- "$keychain"
          while IFS= read -r existing; do set -- "$@" "$existing"; done < "$RUNNER_TEMP/keychains.txt"
          security list-keychains -d user -s "$@"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"
          printf '%s' "$DEVELOPER_ID_PROFILE" | base64 --decode > "$RUNNER_TEMP/runnir.provisionprofile"
          echo "RUNNIR_PROFILE=$RUNNER_TEMP/runnir.provisionprofile" >> "$GITHUB_ENV"
          scripts/signing-identity.sh > /dev/null

      - name: Sign the Core binaries and the app
        run: |
          for goarch in arm64 amd64; do
            scripts/sign-binary.sh "build/export/runnir-${GITHUB_REF_NAME}-darwin-${goarch}" com.runnir.cli
          done
          scripts/sign-app.sh "$APP"

      - name: Notarize and staple
        # One submission for the app and the two darwin binaries, so the job
        # waits for Apple once. A bare command-line binary cannot carry a
        # ticket, so macOS checks it online; the app's ticket is stapled.
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          mkdir "$RUNNER_TEMP/notarize"
          ditto "$APP" "$RUNNER_TEMP/notarize/Runnir.app"
          cp build/export/runnir-"${GITHUB_REF_NAME}"-darwin-* "$RUNNER_TEMP/notarize/"
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          scripts/notarize.sh "$RUNNER_TEMP/notarize.zip"
          scripts/staple-app.sh "$APP"

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "$APP" "build/export/Runnir-${GITHUB_REF_NAME}.zip"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease_flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "build/export/Runnir-${GITHUB_REF_NAME}.zip" \
            build/export/runnir-* \
            --draft \
            ${prerelease_flag} \
            --title "Runnir ${GITHUB_REF_NAME}" \
            --notes "Runnir.app and the macOS command-line binaries are signed with Developer ID and notarized by Apple. The Linux and Windows binaries are not signed."

      - name: Check release assets
        # Downloads every asset back from the release and compares it with
        # the file that was built.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd build/export && shasum -a 256 Runnir-* runnir-*) > "$RUNNER_TEMP/built.sha256"
          gh release download "${GITHUB_REF_NAME}" --dir "$RUNNER_TEMP/downloaded"
          (cd "$RUNNER_TEMP/downloaded" && shasum -a 256 -c "$RUNNER_TEMP/built.sha256")
          test "$(ls "$RUNNER_TEMP/downloaded" | wc -l)" -eq "$(wc -l < "$RUNNER_TEMP/built.sha256")"

      - name: Clean up signing
        # Whatever happened before: the keychain search list as it was, the
        # temporary keychains and the key files gone.
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/keychains.txt" ]; then
            set --
            while IFS= read -r existing; do set -- "$@" "$existing"; done < "$RUNNER_TEMP/keychains.txt"
            security list-keychains -d user -s "$@"
          fi
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/check.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/runnir.provisionprofile" \
            "$RUNNER_TEMP/check.p12" "$RUNNER_TEMP/check.provisionprofile"
