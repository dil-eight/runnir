// Runnir Core local gRPC contract, version 1. See ADR 0004.
//
// Every repository-scoped call carries repository_id. Until the first release
// tag the contract changes in place (AGENTS.md); from then on additive changes
// keep this package and breaking changes require a new package version.
syntax = "proto3";

package runnir.core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "runnir/core/internal/gen/runnir/core/v1;corev1";

service RunnirCore {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Idempotent per resolved path: reopening returns the existing context.
  rpc OpenRepository(OpenRepositoryRequest) returns (RepositoryResponse);
  rpc CloseRepository(CloseRepositoryRequest) returns (CloseRepositoryResponse);
  rpc RefreshRepository(RefreshRepositoryRequest) returns (RepositoryResponse);

  // A workspace's GitHub activity as cached on this Mac: the newest runs,
  // the workflows and how fresh they are. Never waits for GitHub. Needs a
  // repository opened with a workspace_id (FAILED_PRECONDITION otherwise).
  rpc GetWorkspaceActivity(GetWorkspaceActivityRequest) returns (WorkspaceActivity);
  // Asks the workspace's sync for a pass; requests during a pass are merged
  // into one more. With wait, answers after a pass that started after the
  // request ended.
  rpc RefreshWorkspaceActivity(RefreshWorkspaceActivityRequest) returns (WorkspaceActivity);
  // What workspaces keep on this Mac, by id; empty ids: every workspace with
  // data and every open one.
  rpc GetStorageUsage(GetStorageUsageRequest) returns (GetStorageUsageResponse);
  // Deletes what can be downloaded again (runs, jobs, workflows, kept
  // logs); local run history, backups and recovery copies stay.
  rpc ClearWorkspaceCache(ClearWorkspaceCacheRequest) returns (ClearWorkspaceCacheResponse);
  // Deletes a workspace's whole folder; refused while it is open.
  rpc DeleteWorkspaceData(DeleteWorkspaceDataRequest) returns (DeleteWorkspaceDataResponse);
  // Whether completed jobs' logs are kept on this Mac. Off in every new Core.
  rpc SetStoragePreferences(SetStoragePreferencesRequest) returns (SetStoragePreferencesResponse);

  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // Run Workflow presets the repository shares in .runnir/launches, read in
  // the same scan as its workflows. Runnir never writes these files.
  rpc ListLaunchPresets(ListLaunchPresetsRequest) returns (ListLaunchPresetsResponse);
  // Checks the workflow files on disk now with actionlint, built into the
  // Core; no external program runs and nothing is sent anywhere.
  rpc ValidateWorkflows(ValidateWorkflowsRequest) returns (ValidateWorkflowsResponse);
  // Saves a workflow file the user edited, replacing it in one rename. The
  // file is only written while it still has base_sha256, the digest of what
  // the editor loaded; otherwise the response reports a conflict and nothing
  // changes, unless overwrite is set. The repository is scanned again after
  // a save.
  rpc SaveWorkflowFile(SaveWorkflowFileRequest) returns (SaveWorkflowFileResponse);
  // Adds a workflow file to .github/workflows, making the folders when they
  // are missing, and scans the repository again. A name that is taken is
  // refused (ALREADY_EXISTS); no file is ever replaced.
  rpc CreateWorkflowFile(CreateWorkflowFileRequest) returns (CreateWorkflowFileResponse);
  // Renames a workflow file within .github/workflows and scans the
  // repository again. A name another file has is refused (ALREADY_EXISTS).
  rpc RenameWorkflowFile(RenameWorkflowFileRequest) returns (RenameWorkflowFileResponse);

  // Starts an execution without a reviewed plan. Local runs need one, so
  // executions started this way fail; use PrepareLocalRun.
  rpc StartWorkflow(StartWorkflowRequest) returns (ExecutionResponse);

  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream CoreEvent);

  // The app hands the signed-in user's GitHub token to the Core's memory. It
  // is never written to disk, logged, sent in events or returned by any call.
  rpc SetGitHubCredential(SetGitHubCredentialRequest) returns (SetGitHubCredentialResponse);
  rpc ClearGitHubCredential(ClearGitHubCredentialRequest) returns (ClearGitHubCredentialResponse);
  // Asks GitHub what a token can do, without holding it: whether it is
  // accepted, its kind, and the rights Runnir needs that it has, lacks or
  // that GitHub does not show without trying a change. A refused token is
  // TOKEN_REJECTED in `status`; the held credential is never changed.
  rpc CheckGitHubToken(CheckGitHubTokenRequest) returns (CheckGitHubTokenResponse);

  // The signed-in user's open pull requests, each with the state of the
  // GitHub Actions runs on its head commit, and those closed since a time,
  // newest first, at most 50 of each, read through GitHub's search.
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse);

  // The github.com repository each folder's origin points at, read from git's
  // metadata only, without opening the repositories: lets the app match its
  // registered working trees to GitHub repositories. At most 500 paths.
  rpc GetGitHubOrigins(GetGitHubOriginsRequest) returns (GetGitHubOriginsResponse);

  // The github.com repositories the signed-in user's token reaches: those of
  // the accounts where the Runnir Desktop app is installed, up to 1,000.
  rpc ListGitHubRepositories(ListGitHubRepositoriesRequest) returns (ListGitHubRepositoriesResponse);

  // GitHub Actions data for a github.com repository, read with the token
  // from SetGitHubCredential: the one an open repository's origin points at
  // (repository_id), or any repository by name (github_repository) for one
  // without a local clone. GitHub-side problems are reported in `status`,
  // not as call errors.
  rpc ListGitHubWorkflows(ListGitHubWorkflowsRequest) returns (ListGitHubWorkflowsResponse);
  // The GitHub repository itself: whether the token can see it, and its
  // visibility and default branch.
  rpc GetGitHubRepository(GetGitHubRepositoryRequest) returns (GetGitHubRepositoryResponse);
  rpc ListWorkflowRuns(ListWorkflowRunsRequest) returns (ListWorkflowRunsResponse);
  rpc ListRunJobs(ListRunJobsRequest) returns (ListRunJobsResponse);

  // Branches and tags a workflow can run on.
  rpc ListGitHubRefs(ListGitHubRefsRequest) returns (ListGitHubRefsResponse);
  // Whether a workflow can be started by hand at a ref, and its inputs, read
  // from the workflow file on GitHub at that ref.
  rpc DescribeWorkflowDispatch(DescribeWorkflowDispatchRequest) returns (DescribeWorkflowDispatchResponse);
  // Starting a workflow takes two calls: Prepare validates and returns a
  // single-use confirmation that expires; only Confirm sends it to GitHub.
  rpc PrepareWorkflowDispatch(PrepareWorkflowDispatchRequest) returns (PrepareWorkflowDispatchResponse);
  rpc ConfirmWorkflowDispatch(ConfirmWorkflowDispatchRequest) returns (ConfirmWorkflowDispatchResponse);

  // The end of one job's log (at most 2 MiB and 50,000 lines), split into
  // lines that are tagged with their kind and the step that wrote them.
  rpc GetJobLog(GetJobLogRequest) returns (GetJobLogResponse);
  // Cancelling or re-running a run takes two calls, like a dispatch: Prepare
  // checks the run's current state and returns a single-use confirmation;
  // only Confirm sends the request to GitHub, once.
  rpc PrepareRunAction(PrepareRunActionRequest) returns (PrepareRunActionResponse);
  rpc ConfirmRunAction(ConfirmRunActionRequest) returns (ConfirmRunActionResponse);

  // The programs local runs need, as found on this computer: the act bundled
  // with Runnir, an installed act, the Docker CLI and the container engine
  // of the current Docker context. Read-only: nothing is installed, started
  // or switched. The last result is reused unless refresh is set.
  rpc GetToolReadiness(GetToolReadinessRequest) returns (GetToolReadinessResponse);
  // Running a workflow locally takes two calls, like a dispatch: Prepare
  // checks the tools and the workflow file and returns the plan, with a
  // single-use confirmation when nothing blocks it; only Confirm starts act.
  rpc PrepareLocalRun(PrepareLocalRunRequest) returns (PrepareLocalRunResponse);
  rpc ConfirmLocalRun(ConfirmLocalRunRequest) returns (ConfirmLocalRunResponse);
  // A local run's state, job states and the output lines after a sequence
  // number. The Core keeps the last 5,000 lines of each of the last 20 runs.
  rpc GetLocalRunOutput(GetLocalRunOutputRequest) returns (GetLocalRunOutputResponse);
  // Stops a queued or running execution; a local run's containers are
  // removed afterwards.
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string core_version = 1;
  uint32 protocol_version = 2;
  uint32 open_repository_count = 3;
  // Resident memory of the Core process in bytes, for diagnostics.
  uint64 resident_memory_bytes = 4;
  // Operating-system process id of the Core, so a supervisor can tell that
  // the Core answering is the child it launched and not another instance.
  uint32 process_id = 5;
  // Whether a GitHub token is currently held (never the token itself).
  bool github_credential_set = 6;
}

message OpenRepositoryRequest {
  // Absolute path of a working tree already granted to the app.
  string path = 1;
  // The registry's UUID of the workspace; gives the repository its
  // database and sync. Empty opens without them.
  string workspace_id = 2;
}

message CloseRepositoryRequest {
  string repository_id = 1;
}

message CloseRepositoryResponse {}

message RefreshRepositoryRequest {
  string repository_id = 1;
}

message RepositoryResponse {
  Repository repository = 1;
}

message Repository {
  // Stable id, independent of window and path spelling.
  string id = 1;
  string path = 2;
  // Empty when HEAD is detached or unreadable.
  string branch = 3;
  uint32 workflow_count = 4;
  google.protobuf.Timestamp last_refresh = 5;
  // "owner/name" when the origin's host is github.com or a server the Core
  // holds; empty otherwise. The raw remote URL is never sent: it can embed
  // credentials.
  string github_repository = 6;
  // Server id for github_repository; empty is github.com.
  string github_server_id = 7;
  // Host of the origin remote, lowercased, even when no server matches it,
  // so the app can say which server to add. Empty without an origin.
  string origin_host = 8;
}

message ListWorkflowsRequest {
  string repository_id = 1;
}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
}

message Workflow {
  // Path relative to the repository root, e.g. .github/workflows/ci.yml.
  string id = 1;
  string name = 2;
  repeated string triggers = 3;
  repeated Job jobs = 4;
  // Set when the file could not be parsed; other fields may be partial.
  string parse_error = 5;
}

message Job {
  string id = 1;
  string name = 2;
  repeated string needs = 3;
}

message ListLaunchPresetsRequest {
  string repository_id = 1;
}

message ListLaunchPresetsResponse {
  // Usable presets by name, then path; entries with a problem after them, by path.
  repeated LaunchPreset presets = 1;
}

message LaunchPreset {
  // ".runnir/launches/<file>", or ".runnir" / ".runnir/launches" for a problem with that folder.
  string path = 1;
  string name = 2;
  // ".github/workflows/<file>".
  string workflow_path = 3;
  // Empty: keep the branch the form has.
  string ref = 4;
  map<string, string> inputs = 5;
  // Why the entry cannot be used; empty when it can. Other fields are empty then.
  string problem = 6;
}

message StartWorkflowRequest {
  string repository_id = 1;
  string workflow_id = 2;
  string ref = 3;
}

enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_QUEUED = 1;
  EXECUTION_STATE_RUNNING = 2;
  EXECUTION_STATE_SUCCEEDED = 3;
  EXECUTION_STATE_FAILED = 4;
  EXECUTION_STATE_CANCELLED = 5;
}

message ExecutionResponse {
  string execution_id = 1;
  string repository_id = 2;
  ExecutionState state = 3;
}

message SubscribeEventsRequest {
  // Empty means all repositories.
  repeated string repository_ids = 1;
}

enum CoreEventType {
  CORE_EVENT_TYPE_UNSPECIFIED = 0;
  CORE_EVENT_TYPE_CORE_READY = 1;
  CORE_EVENT_TYPE_REPOSITORY_OPENED = 2;
  CORE_EVENT_TYPE_REPOSITORY_REFRESHED = 3;
  CORE_EVENT_TYPE_REPOSITORY_CLOSED = 4;
  CORE_EVENT_TYPE_WORKFLOW_STARTED = 5;
  CORE_EVENT_TYPE_WORKFLOW_STATUS_CHANGED = 6;
  CORE_EVENT_TYPE_WORKFLOW_COMPLETED = 7;
  CORE_EVENT_TYPE_WORKFLOW_FAILED = 8;
  CORE_EVENT_TYPE_CORE_ERROR = 9;
  // A workspace's cached activity or its freshness changed; read it again.
  CORE_EVENT_TYPE_ACTIVITY_CHANGED = 10;
}

message CoreEvent {
  // Monotonic per Core process; lets clients detect gaps after reconnect.
  uint64 sequence = 1;
  CoreEventType type = 2;
  // Empty for events not tied to a repository (CORE_READY, some CORE_ERROR).
  string repository_id = 3;
  string execution_id = 4;
  ExecutionState execution_state = 5;
  // Human-readable detail; never contains credentials.
  string message = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

message SetGitHubCredentialRequest {
  string token = 1;
  // Which server the token is for; unset is github.com.
  GithubServer server = 2;
}

// A GitHub server: github.com when id is empty (api_url and web_host are
// then ignored), otherwise an Enterprise server the app registered.
message GithubServer {
  // Empty for github.com; a lowercase UUID for an Enterprise server.
  string id = 1;
  // "https://github.company.com/api/v3"; http only for a loopback host.
  string api_url = 2;
  // Host of the web URL, lowercased, without port: "github.company.com".
  string web_host = 3;
}

message SetGitHubCredentialResponse {
  GithubCredentialKind kind = 1;
}

// What issued a token, from GitHub's prefixes.
enum GithubCredentialKind {
  GITHUB_CREDENTIAL_KIND_UNSPECIFIED = 0;
  // Signing in to the Runnir Desktop app: reaches its installations.
  GITHUB_CREDENTIAL_KIND_APP_USER = 1;
  // Personal access token (classic): scopes.
  GITHUB_CREDENTIAL_KIND_CLASSIC = 2;
  // Fine-grained personal access token: chosen repositories and permissions.
  GITHUB_CREDENTIAL_KIND_FINE_GRAINED = 3;
  GITHUB_CREDENTIAL_KIND_OAUTH = 4;
  GITHUB_CREDENTIAL_KIND_OTHER = 5;
}

message CheckGitHubTokenRequest {
  string token = 1;
  // The server to ask; unset is github.com.
  GithubServer server = 2;
}

message CheckGitHubTokenResponse {
  GitHubStatus status = 1;
  GithubCredentialKind kind = 2;
  string login = 3;
  // Scopes of a classic or OAuth token.
  repeated string scopes = 4;
  // Unset when the token does not expire or GitHub does not say.
  google.protobuf.Timestamp expires_at = 5;
  // Repositories a fine-grained token reaches, counted up to 100.
  int32 repositories = 6;
  repeated GitHubTokenCheck checks = 7;
  // Nothing Runnir needs is missing; unknown checks do not count.
  bool suitable = 8;
}

message GitHubTokenCheck {
  string name = 1;
  GithubTokenCheckState state = 2;
  string detail = 3;
}

enum GithubTokenCheckState {
  GITHUB_TOKEN_CHECK_STATE_UNSPECIFIED = 0;
  GITHUB_TOKEN_CHECK_STATE_PASSED = 1;
  GITHUB_TOKEN_CHECK_STATE_MISSING = 2;
  // GitHub does not tell without trying a change.
  GITHUB_TOKEN_CHECK_STATE_UNKNOWN = 3;
}

message ClearGitHubCredentialRequest {
  // Empty clears github.com's token; an Enterprise id forgets that server.
  string server_id = 1;
}

message ClearGitHubCredentialResponse {}

enum GithubAccess {
  GITHUB_ACCESS_UNSPECIFIED = 0;
  GITHUB_ACCESS_OK = 1;
  // The origin remote is not on github.com.
  GITHUB_ACCESS_NO_REMOTE = 2;
  // The Core holds no token.
  GITHUB_ACCESS_SIGNED_OUT = 3;
  // GitHub refused the token; the Core forgot it.
  GITHUB_ACCESS_TOKEN_REJECTED = 4;
  // The app is not installed on the repository, or the user cannot see it.
  GITHUB_ACCESS_NOT_VISIBLE = 5;
  GITHUB_ACCESS_RATE_LIMITED = 6;
  GITHUB_ACCESS_UNAVAILABLE = 7;
  // The app is installed, but GitHub says it or the user lacks a permission
  // for this ("Resource not accessible by integration"): the installation
  // has not accepted permissions the app now asks for, or the user cannot
  // write to the repository.
  GITHUB_ACCESS_PERMISSION_MISSING = 8;
}

message GitHubStatus {
  GithubAccess access = 1;
  // When RATE_LIMITED: when GitHub accepts requests again.
  google.protobuf.Timestamp retry_after = 2;
}

message ValidateWorkflowsRequest {
  string repository_id = 1;
  // A workflow id from ListWorkflows; empty checks every workflow file.
  string workflow_id = 2;
}

message WorkflowDiagnostic {
  // 1-based; 0 when actionlint gives no position.
  int32 line = 1;
  int32 column = 2;
  // The actionlint rule, for example "syntax-check" or "job-needs".
  string kind = 3;
  string message = 4;
}

message WorkflowValidation {
  string workflow_id = 1;
  repeated WorkflowDiagnostic diagnostics = 2;
  // Set when the file could not be checked, for example when it is too large.
  string problem = 3;
  // More than 200 diagnostics were found; the first ones are returned.
  bool truncated = 4;
}

message ValidateWorkflowsResponse {
  repeated WorkflowValidation workflows = 1;
  // "actionlint v1.7.12".
  string validator = 2;
  // The repository's actionlint config could not be used; the files were
  // checked with the defaults.
  string config_problem = 3;
}

message GetGitHubRepositoryRequest {
  string repository_id = 1;
  // "owner/name" on the server github_server names, used instead of
  // repository_id for a repository without a local clone.
  string github_repository = 2;
  // Server id for github_repository; empty is github.com.
  string github_server = 3;
}

message GetGitHubRepositoryResponse {
  GitHubStatus status = 1;
  // "owner/name" as GitHub spells it.
  string full_name = 2;
  // "public", "private" or "internal".
  string visibility = 3;
  string default_branch = 4;
  string html_url = 5;
  // The signed-in user can push, so can start, cancel and re-run workflows.
  bool can_push = 6;
  // The installation of the repository's owner, when the user can see it.
  GitHubInstallation installation = 7;
}

message ListGitHubWorkflowsRequest {
  string repository_id = 1;
  // "owner/name" on the server github_server names, used instead of
  // repository_id for a repository without a local clone.
  string github_repository = 2;
  // Server id for github_repository; empty is github.com.
  string github_server = 3;
}

message ListPullRequestsRequest {
  // Closed pull requests from this time on; unset means the last 24 hours,
  // and it reaches back at most 7 days.
  google.protobuf.Timestamp closed_since = 1;
  // Server id; empty is github.com.
  string github_server = 2;
}

message ListPullRequestsResponse {
  GitHubStatus status = 1;
  repeated PullRequest open = 2;
  repeated PullRequest closed = 3;
  // The head of some open pull request could not be read, because the
  // token lacks Pull requests read; their CI is UNKNOWN.
  bool heads_unreadable = 4;
}

message PullRequest {
  // "owner/name".
  string repository = 1;
  int64 number = 2;
  string title = 3;
  string html_url = 4;
  // "open", "closed" or "merged".
  string state = 5;
  bool draft = 6;
  string head_branch = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp closed_at = 9;
  PullRequestCi ci = 10;
  int32 ci_runs = 11;
  int32 ci_failed = 12;
  int32 ci_running = 13;
  // The run to look at: the first failed one, else the first running one.
  string ci_url = 14;
}

// The GitHub Actions runs on a pull request's head commit, summed up.
enum PullRequestCi {
  PULL_REQUEST_CI_UNSPECIFIED = 0;
  PULL_REQUEST_CI_NONE = 1;
  PULL_REQUEST_CI_RUNNING = 2;
  PULL_REQUEST_CI_PASSED = 3;
  PULL_REQUEST_CI_FAILED = 4;
  PULL_REQUEST_CI_CANCELLED = 5;
  PULL_REQUEST_CI_UNKNOWN = 6;
}

message GetGitHubOriginsRequest {
  // Absolute paths of working trees.
  repeated string paths = 1;
}

message GetGitHubOriginsResponse {
  // One per path whose origin host is github.com or a server the Core
  // holds; paths without one, or that cannot be read, are left out.
  repeated GitHubOrigin origins = 1;
}

message GitHubOrigin {
  string path = 1;
  // "owner/name".
  string github_repository = 2;
  // Server id of the origin's host; empty is github.com.
  string github_server_id = 3;
}

message ListGitHubRepositoriesRequest {
  // Server id; empty is github.com.
  string github_server = 1;
}

message ListGitHubRepositoriesResponse {
  GitHubStatus status = 1;
  // Accounts where the Runnir Desktop app is installed and the user can see
  // the installation.
  repeated GitHubInstallation installations = 2;
  // Newest push first.
  repeated GitHubAccountRepository repositories = 3;
  // More repositories exist than were read.
  bool truncated = 4;
  // A personal token lists what it reaches and has no installations.
  GithubCredentialKind credential_kind = 5;
}

message GitHubInstallation {
  int64 id = 1;
  // The user or organization login.
  string account = 2;
  // "User" or "Organization".
  string account_type = 3;
  // "all" or "selected": whether the app reaches every repository of the
  // account or only chosen ones.
  string repository_selection = 4;
  // Where the account's owner changes which repositories the app reaches
  // and accepts new permissions.
  string html_url = 5;
  // Permissions Runnir needs that the installation has not granted, such as
  // "actions: write": the app asks for them and an owner has not accepted.
  repeated string missing_permissions = 6;
  // GitHub suspended the installation; it reaches no repository.
  bool suspended = 7;
}

message GitHubAccountRepository {
  // "owner/name" as GitHub spells it.
  string full_name = 1;
  string owner = 2;
  string name = 3;
  string description = 4;
  // "public", "private" or "internal".
  string visibility = 5;
  string default_branch = 6;
  string html_url = 7;
  google.protobuf.Timestamp pushed_at = 8;
  bool archived = 9;
  bool fork = 10;
  // The user can push, so can start workflows.
  bool can_push = 11;
  int64 installation_id = 12;
}

message ListGitHubWorkflowsResponse {
  GitHubStatus status = 1;
  repeated GitHubWorkflow workflows = 2;
}

message GitHubWorkflow {
  int64 id = 1;
  string name = 2;
  string path = 3;
  string state = 4;
  string html_url = 5;
}

message ListWorkflowRunsRequest {
  string repository_id = 1;
  // Empty means every branch.
  string branch = 2;
  // 1 to 100; 0 means 100.
  uint32 limit = 3;
  // "owner/name" on the server github_server names, used instead of
  // repository_id for a repository without a local clone.
  string github_repository = 4;
  // Server id for github_repository; empty is github.com.
  string github_server = 5;
}

message ListWorkflowRunsResponse {
  GitHubStatus status = 1;
  repeated WorkflowRun runs = 2;
}

message WorkflowRun {
  int64 id = 1;
  int64 workflow_id = 2;
  string name = 3;
  string display_title = 4;
  int64 run_number = 5;
  string event = 6;
  string status = 7;
  // Empty while the run is not completed.
  string conclusion = 8;
  string branch = 9;
  string head_sha = 10;
  string actor = 11;
  string html_url = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // 1 for the first attempt; each re-run adds one.
  int64 run_attempt = 15;
}

message ListRunJobsRequest {
  string repository_id = 1;
  int64 run_id = 2;
  // "owner/name" on the server github_server names, used instead of
  // repository_id for a repository without a local clone.
  string github_repository = 3;
  // Server id for github_repository; empty is github.com.
  string github_server = 4;
}

message ListRunJobsResponse {
  GitHubStatus status = 1;
  repeated RunJob jobs = 2;
}

message RunJob {
  int64 id = 1;
  string name = 2;
  string status = 3;
  string conclusion = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  string html_url = 7;
  repeated RunStep steps = 8;
}

message RunStep {
  int64 number = 1;
  string name = 2;
  string status = 3;
  string conclusion = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
}

message ListGitHubRefsRequest {
  string repository_id = 1;
  // "owner/name" on the server github_server names, used instead of
  // repository_id for a repository without a local clone.
  string github_repository = 2;
  // Server id for github_repository; empty is github.com.
  string github_server = 3;
}

message ListGitHubRefsResponse {
  GitHubStatus status = 1;
  string default_branch = 2;
  repeated string branches = 3;
  repeated string tags = 4;
}

enum DispatchInputType {
  DISPATCH_INPUT_TYPE_UNSPECIFIED = 0;
  DISPATCH_INPUT_TYPE_STRING = 1;
  DISPATCH_INPUT_TYPE_BOOLEAN = 2;
  DISPATCH_INPUT_TYPE_CHOICE = 3;
  DISPATCH_INPUT_TYPE_NUMBER = 4;
  DISPATCH_INPUT_TYPE_ENVIRONMENT = 5;
}

message DispatchInput {
  string name = 1;
  string description = 2;
  DispatchInputType type = 3;
  bool required = 4;
  string default_value = 5;
  repeated string options = 6;
}

message DescribeWorkflowDispatchRequest {
  string repository_id = 1;
  string workflow_path = 2;
  string ref = 3;
  // "owner/name" on the server github_server names, used instead of
  // repository_id for a repository without a local clone.
  string github_repository = 4;
  // Server id for github_repository; empty is github.com.
  string github_server = 5;
}

message DescribeWorkflowDispatchResponse {
  // NOT_VISIBLE also covers a workflow file that does not exist at the ref.
  GitHubStatus status = 1;
  bool dispatchable = 2;
  repeated DispatchInput inputs = 3;
  // Set when the workflow file at the ref is not valid YAML.
  string parse_error = 4;
}

message PrepareWorkflowDispatchRequest {
  string repository_id = 1;
  int64 workflow_id = 2;
  string ref = 3;
  // Only the inputs the user set; GitHub applies the defaults.
  map<string, string> inputs = 4;
  // "owner/name" on the server github_server names, used instead of
  // repository_id for a repository without a local clone.
  string github_repository = 5;
  // Server id for github_repository; empty is github.com.
  string github_server = 6;
}

message PrepareWorkflowDispatchResponse {
  GitHubStatus status = 1;
  // Empty when `problems` is not.
  string dispatch_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Readable reasons the request cannot run as given.
  repeated string problems = 4;
  string workflow_path = 5;
}

message ConfirmWorkflowDispatchRequest {
  string dispatch_id = 1;
}

message ConfirmWorkflowDispatchResponse {
  GitHubStatus status = 1;
  // When the request was sent; the new run is created at or after it.
  google.protobuf.Timestamp dispatched_at = 2;
  // 0 when GitHub did not say which run it started.
  int64 run_id = 3;
  // GitHub's reason when it refused the request (status is OK then).
  string rejection = 4;
}

message GetJobLogRequest {
  string repository_id = 1;
  int64 job_id = 2;
}

enum JobLogAvailability {
  JOB_LOG_AVAILABILITY_UNSPECIFIED = 0;
  JOB_LOG_AVAILABILITY_AVAILABLE = 1;
  // GitHub no longer has the log: its retention passed or it was deleted.
  // A job that never ran has no log and is AVAILABLE with no lines.
  JOB_LOG_AVAILABILITY_EXPIRED = 2;
  // The job has not finished, or finished moments ago and GitHub is still
  // storing the log; ask again shortly.
  JOB_LOG_AVAILABILITY_NOT_READY = 3;
}

enum LogLineKind {
  LOG_LINE_KIND_UNSPECIFIED = 0;
  LOG_LINE_KIND_PLAIN = 1;
  LOG_LINE_KIND_ERROR = 2;
  LOG_LINE_KIND_WARNING = 3;
  LOG_LINE_KIND_NOTICE = 4;
  LOG_LINE_KIND_COMMAND = 5;
  // The title of a collapsible group (##[group]).
  LOG_LINE_KIND_GROUP = 6;
  LOG_LINE_KIND_END_GROUP = 7;
  LOG_LINE_KIND_DEBUG = 8;
}

message LogLine {
  // Counts from 1 in the full log, including lines dropped by truncation.
  int64 number = 1;
  // Without the timestamp, terminal colors and the workflow command marker.
  string text = 2;
  LogLineKind kind = 3;
  // The step running when the line was written (matched by time); 0 if none.
  int64 step_number = 4;
}

message GetJobLogResponse {
  GitHubStatus status = 1;
  JobLogAvailability availability = 2;
  repeated LogLine lines = 3;
  // Earlier lines were dropped to keep the response bounded.
  bool truncated = 4;
  // The log is larger than the Core reads (256 MiB): the lines are the end
  // of what was read, not the end of the log.
  bool stopped_early = 5;
}

enum RunAction {
  RUN_ACTION_UNSPECIFIED = 0;
  RUN_ACTION_CANCEL = 1;
  // A new attempt of every job.
  RUN_ACTION_RERUN = 2;
  // A new attempt of the failed and cancelled jobs and the jobs that need them.
  RUN_ACTION_RERUN_FAILED = 3;
}

message PrepareRunActionRequest {
  string repository_id = 1;
  int64 run_id = 2;
  RunAction action = 3;
}

message PrepareRunActionResponse {
  GitHubStatus status = 1;
  // Empty when `problems` is not.
  string action_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Readable reasons the action cannot be taken now, for example a run that
  // finished before it could be cancelled.
  repeated string problems = 4;
  // The run as GitHub reported it while preparing.
  WorkflowRun run = 5;
}

message ConfirmRunActionRequest {
  string action_id = 1;
}

message ConfirmRunActionResponse {
  GitHubStatus status = 1;
  // When GitHub accepted the request. Cancelling and re-running then happen
  // asynchronously; the run's status shows the outcome.
  google.protobuf.Timestamp accepted_at = 2;
  // GitHub's reason when it refused the request (status is OK then), for
  // example a run that finished meanwhile or one too old to re-run.
  string rejection = 3;
}

enum ToolState {
  TOOL_STATE_UNSPECIFIED = 0;
  // Present, answering and new enough.
  TOOL_STATE_FOUND = 1;
  // Not installed, or no engine is configured.
  TOOL_STATE_MISSING = 2;
  // An engine is configured but does not answer.
  TOOL_STATE_STOPPED = 3;
  // Too old, or an engine on another computer.
  TOOL_STATE_UNSUPPORTED = 4;
  // The check could not finish.
  TOOL_STATE_FAILED = 5;
}

message ToolStatus {
  ToolState state = 1;
  string version = 2;
  // The executable that was checked.
  string path = 3;
  string detail = 4;
  // Newer than the version local runs were verified with.
  bool untested = 5;
}

message ContainerEngine {
  ToolState state = 1;
  // OrbStack, Docker Desktop, Colima, Rancher Desktop, Podman or Docker Engine.
  string name = 2;
  // The current Docker context; Runnir never switches it.
  string context = 3;
  // The context's Docker host, without user information.
  string endpoint = 4;
  bool local = 5;
  string version = 6;
  string api_version = 7;
  string architecture = 8;
  uint32 cpus = 9;
  uint64 memory_bytes = 10;
  string detail = 11;
}

message ToolReadiness {
  ToolStatus bundled_act = 1;
  ToolStatus installed_act = 2;
  ToolStatus docker_cli = 3;
  ContainerEngine engine = 4;
  google.protobuf.Timestamp checked_at = 5;
  // The act version Runnir bundles and verified local runs with.
  string tested_act_version = 6;
  string minimum_act_version = 7;
}

message GetToolReadinessRequest {
  bool refresh = 1;
}

message GetToolReadinessResponse {
  ToolReadiness readiness = 1;
}

enum LocalJobSupport {
  LOCAL_JOB_SUPPORT_UNSPECIFIED = 0;
  LOCAL_JOB_SUPPORT_SUPPORTED = 1;
  // act skips the job or it cannot work locally, for example a macOS runner.
  LOCAL_JOB_SUPPORT_UNSUPPORTED = 2;
  // act decides when the job starts, for example runs-on set by an expression.
  LOCAL_JOB_SUPPORT_UNKNOWN = 3;
}

message LocalRunJob {
  string id = 1;
  string name = 2;
  repeated string runs_on = 3;
  // The image the job runs in.
  string image = 4;
  LocalJobSupport support = 5;
  string reason = 6;
}

message LocalRunImage {
  string reference = 1;
  // Already in the engine; otherwise act downloads it.
  bool present = 2;
}

message LocalRunPlan {
  // Path relative to the repository root, as in Workflow.id.
  string workflow_id = 1;
  string workflow_name = 2;
  // The workflow's triggers; `event` is the one the run uses.
  repeated string events = 3;
  string event = 4;
  // The chosen job, empty for every job; a chosen job brings the jobs it needs.
  string job_id = 5;
  repeated LocalRunJob jobs = 6;
  repeated LocalRunImage images = 7;
  // Secrets the workflow reads. Local runs get none.
  repeated string secrets = 8;
  // Differences from a GitHub run worth knowing before starting.
  repeated string notes = 9;
  // Why the run cannot start now. A plan with blockers has no confirmation.
  repeated string blockers = 10;
  uint32 cpus = 11;
  uint64 memory_bytes = 12;
  uint32 timeout_seconds = 13;
  // The act that runs it.
  string act_version = 14;
  bool installed_act = 15;
  string engine_name = 16;
  string engine_context = 17;
}

message PrepareLocalRunRequest {
  string repository_id = 1;
  string workflow_id = 2;
  // Empty runs every job of the workflow.
  string job_id = 3;
  // One of the workflow's triggers; empty picks push, pull_request or
  // workflow_dispatch, in that order.
  string event = 4;
  // Experimental: run with the act installed on this computer when one is
  // usable, instead of the bundled act.
  bool use_installed_act = 5;
}

message PrepareLocalRunResponse {
  ToolReadiness readiness = 1;
  LocalRunPlan plan = 2;
  // Empty when the plan has blockers.
  string confirmation_id = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ConfirmLocalRunRequest {
  string confirmation_id = 1;
}

message ConfirmLocalRunResponse {
  ExecutionResponse execution = 1;
}

enum LocalRunPhase {
  LOCAL_RUN_PHASE_UNSPECIFIED = 0;
  LOCAL_RUN_PHASE_QUEUED = 1;
  LOCAL_RUN_PHASE_RUNNING = 2;
  LOCAL_RUN_PHASE_STOPPING = 3;
  LOCAL_RUN_PHASE_CLEANING_UP = 4;
  LOCAL_RUN_PHASE_FINISHED = 5;
}

enum LocalJobState {
  LOCAL_JOB_STATE_UNSPECIFIED = 0;
  LOCAL_JOB_STATE_WAITING = 1;
  LOCAL_JOB_STATE_RUNNING = 2;
  LOCAL_JOB_STATE_SUCCEEDED = 3;
  LOCAL_JOB_STATE_FAILED = 4;
  LOCAL_JOB_STATE_SKIPPED = 5;
  LOCAL_JOB_STATE_UNSUPPORTED = 6;
  LOCAL_JOB_STATE_CANCELLED = 7;
  LOCAL_JOB_STATE_NOT_RUN = 8;
}

message LocalRunJobStatus {
  string id = 1;
  string name = 2;
  LocalJobState state = 3;
  string reason = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}

message LocalRunLine {
  uint64 sequence = 1;
  // Empty for act's own messages.
  string job_id = 2;
  string text = 3;
  bool error = 4;
}

message GetLocalRunOutputRequest {
  string execution_id = 1;
  // Lines after this sequence number; 0 for all that are kept.
  uint64 after_sequence = 2;
}

message GetLocalRunOutputResponse {
  string execution_id = 1;
  string repository_id = 2;
  ExecutionState state = 3;
  LocalRunPhase phase = 4;
  repeated LocalRunLine lines = 5;
  // Lines after `after_sequence` were dropped to stay within the bound.
  bool discarded = 6;
  // The highest sequence number so far.
  uint64 last_sequence = 7;
  repeated LocalRunJobStatus jobs = 8;
  LocalRunPlan plan = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp finished_at = 11;
  // act's exit code; -1 until it exits, or when it was killed.
  int32 exit_code = 12;
  // Why the run failed, when it did.
  string message = 13;
  // Set when containers of this run may still exist.
  string cleanup_problem = 14;
}

message CancelExecutionRequest {
  string execution_id = 1;
}

message CancelExecutionResponse {}

message SaveWorkflowFileRequest {
  string repository_id = 1;
  // Path relative to the repository root, as in Workflow.id.
  string workflow_id = 2;
  // The whole new file, UTF-8, at most 1 MiB.
  string content = 3;
  // SHA-256 (hex) of the file as the editor loaded it.
  string base_sha256 = 4;
  // Replace the file even though it changed since it was loaded.
  bool overwrite = 5;
}

message SaveWorkflowFileResponse {
  // SHA-256 (hex) of the file now on disk.
  string sha256 = 1;
  // The file changed since it was loaded and was left as it is; sha256 is
  // then the digest of that version.
  bool conflict = 2;
}

message CreateWorkflowFileRequest {
  string repository_id = 1;
  // A file name such as "deploy.yml": letters, digits, ".", "_" and "-",
  // starting with a letter or digit, ending in .yml or .yaml, at most 100
  // characters.
  string file_name = 2;
  // The file, UTF-8, at most 1 MiB. Empty: a starter workflow with one job
  // that runs by hand (workflow_dispatch).
  string content = 3;
}

message CreateWorkflowFileResponse {
  // The new file's Workflow.id, such as ".github/workflows/deploy.yml".
  string workflow_id = 1;
}

message RenameWorkflowFileRequest {
  string repository_id = 1;
  string workflow_id = 2;
  // The new file name, with the rules of CreateWorkflowFileRequest.file_name.
  string new_file_name = 3;
}

message RenameWorkflowFileResponse {
  // The file's Workflow.id under its new name.
  string workflow_id = 1;
}

message GetWorkspaceActivityRequest {
  string repository_id = 1;
  // Runs to return, newest first: 1 to 200; 0 means 50.
  uint32 limit = 2;
}

message RefreshWorkspaceActivityRequest {
  string repository_id = 1;
  bool wait = 2;
  uint32 limit = 3;
}

message WorkspaceActivity {
  repeated WorkflowRun runs = 1;
  repeated GitHubWorkflow workflows = 2;
  ActivityFreshness freshness = 3;
}

enum ActivitySource {
  ACTIVITY_SOURCE_UNSPECIFIED = 0;
  // Nothing is cached for the repository the origin points at now.
  ACTIVITY_SOURCE_NONE = 1;
  // Read from this Mac; no pass reached GitHub since the Core started.
  ACTIVITY_SOURCE_CACHE = 2;
  // A pass reached GitHub since the Core started.
  ACTIVITY_SOURCE_LIVE = 3;
}

message ActivityFreshness {
  ActivitySource source = 1;
  bool syncing = 2;
  // The last pass's outcome; unset before the first one.
  GitHubStatus status = 3;
  // When the last pass ended.
  google.protobuf.Timestamp checked_at = 4;
  // When a pass last got answers (new data or not modified).
  google.protobuf.Timestamp synced_at = 5;
  // When the cached data last changed.
  google.protobuf.Timestamp changed_at = 6;
}

enum StorageState {
  STORAGE_STATE_UNSPECIFIED = 0;
  STORAGE_STATE_PERSISTENT = 1;
  // Kept in memory for now; note says why.
  STORAGE_STATE_MEMORY_ONLY = 2;
  // Nothing on this Mac.
  STORAGE_STATE_ABSENT = 3;
}

message WorkspaceStorage {
  // Lowercase UUID.
  string workspace_id = 1;
  StorageState state = 2;
  // Why it is in memory, or what recovery did. Never a credential.
  string note = 3;
  bool open = 4;
  // The database and its write-ahead log.
  uint64 database_bytes = 5;
  uint64 log_bytes = 6;
  uint32 cached_runs = 7;
  uint32 local_runs = 8;
  uint32 recovery_copies = 9;
}

message GetStorageUsageRequest {
  repeated string workspace_ids = 1;
}

message GetStorageUsageResponse {
  repeated WorkspaceStorage workspaces = 1;
  bool keep_job_logs = 2;
}

message ClearWorkspaceCacheRequest {
  // Empty: every workspace.
  repeated string workspace_ids = 1;
}

message ClearWorkspaceCacheResponse {
  repeated WorkspaceStorage workspaces = 1;
}

message DeleteWorkspaceDataRequest {
  string workspace_id = 1;
}

message DeleteWorkspaceDataResponse {}

message SetStoragePreferencesRequest {
  bool keep_job_logs = 1;
  // With keep_job_logs off: also delete the logs kept so far.
  bool delete_kept_logs = 2;
}

message SetStoragePreferencesResponse {}
